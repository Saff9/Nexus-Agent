name: Build Desktop Apps

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: nexus-linux
            artifact_path: dist/nexus
          - os: windows-latest
            platform: windows
            artifact_name: nexus-windows.exe
            artifact_path: dist/nexus.exe
          - os: macos-latest
            platform: macos
            artifact_name: nexus-macos.app
            artifact_path: dist/NexusAgent.app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3-dev

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          pip install -e .[cli] || pip install -r requirements.txt || true

      - name: Convert Icon formats
        run: |
          python -c "
          import os
          try:
              from PIL import Image
              if os.path.exists('icon.png'):
                  img = Image.open('icon.png')
                  img.save('icon.ico', format='ICO', sizes=[(256, 256)])
                  img.save('icon.icns', format='ICNS')
                  print('Icons successfully generated.')
          except Exception as e:
              print(f'Icon generation skipped/failed: {e}')
          "

      - name: Build Application
        run: python build.py --platform ${{ matrix.platform }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          retention-days: 7
